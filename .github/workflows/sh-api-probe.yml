# THROWAWAY probe — delete with workers/sh-live-probe.ts once C20's plan B is settled.
#
# Answers three questions about the StreamHatchet /live endpoint that decide how
# the Kick follower sweep is built (see PLAN-launch-code.md C20):
#   1. does /live work without a `game`, so we can page by offset?
#   2. what is the largest `limit` it honours?
#   3. what does it return when rate limited?
#
# It exists as a workflow because the same calls from a laptop return 401
# "Invalid token" with a key that works from Vercel — evidence of IP
# allowlisting. Whether a GitHub runner is allowed is the first thing it shows.
#
# Read-only: three GETs, no database access, no writes. Manual dispatch only.
#
# Requires one repository secret: STREAMHATCHET_API_KEY.

name: SH API probe (throwaway)

on:
  workflow_dispatch:

concurrency:
  group: sh-api-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STREAMHATCHET_API_KEY: ${{ secrets.STREAMHATCHET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fail early if the secret is missing
        run: |
          if [ -z "$STREAMHATCHET_API_KEY" ]; then
            echo "STREAMHATCHET_API_KEY is not set on this repository." >&2
            exit 1
          fi
          echo "key present (${#STREAMHATCHET_API_KEY} chars)"

      - name: Probe /live
        run: npx tsx workers/sh-live-probe.ts
