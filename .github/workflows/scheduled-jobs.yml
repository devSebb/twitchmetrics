# Every recurring data job that used to be an Inngest cron (2026-11-19).
#
# WHY THIS EXISTS. Inngest's Hobby plan allows 50K executions a month and
# counts every step; we ran ~85K, so the crons stopped mid-month (2026-10 and
# again 2026-11-17: game pages lost live Twitch/Kick stats). Here each job is
# one process that runs the same handler as the Inngest function
# (workers/run-job.ts fn <id>), writing the same IngestionRun rows.
#
# WHO STARTS IT. Not GitHub's `schedule`: it starts this repo's runs 6-8
# hours late (the 01:15 UTC daily import started 07:47-09:09 all of
# 2026-11), and none of the 30-min slots fired in the first hour after this
# file landed. A dispatch starts within seconds, so Vercel Cron
# (apps/web/vercel.json) calls /api/cron/dispatch/<slot> on time and the app
# sends a workflow_dispatch with the slot's job ids. The slot table (what
# runs when, in which order) is
# apps/web/src/server/services/github-dispatch.ts:
#   game           */30          game-snapshot (Twitch live game stats)
#   hourly         20 * * * *    kick-category-snapshot,
#                                streamhatchet-live-games-snapshot,
#                                streamhatchet-live-channels-snapshot
#   kick-channels  15 */3 * * *  kick-channel-snapshot
#   discovery      35 */6 * * *  kick-category-discovery,
#                                streamhatchet-game-discovery-snapshot
#   daily          0 4 * * *     enrich-creators, demote-inactive-creators,
#                                discover-games, enrich-games,
#                                discover-creators, enrich-claimed-profiles,
#                                finalize-stale-ingestion-runs
# Jobs of one run go one after the other; a failed job doesn't stop the next.
# Each game snapshot is stamped with the 30-min slot it started in, so a
# missed dispatch is a missing point on the game charts, never a duplicate.
#
# Still on Inngest: refresh-tokens (needs every OAuth client secret), the
# github-jobs-watchdog (must not depend on GitHub) and the app's events
# (claims, connect). Together a few hundred executions a month.
#
# No Upstash secrets on purpose: cache calls are skipped
# (services/cache.ts isCacheConfigured) and cached responses expire on their
# TTL. The per-game SCAN invalidation is what exhausted the Upstash request
# cap in 2026-10.
#
# Manual runs: Actions tab -> this workflow -> Run workflow, with the job ids.
#
# Required repository secrets: DATABASE_URL, DIRECT_URL, TWITCH_CLIENT_ID,
# TWITCH_CLIENT_SECRET, KICK_CLIENT_ID, KICK_CLIENT_SECRET, YOUTUBE_API_KEY,
# TWITTER_BEARER_TOKEN, ENCRYPTION_KEY, STREAMHATCHET_API_KEY (the REST API
# token; verified from a runner 2026-11-20, the API is not IP-restricted).

name: Scheduled jobs

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Job ids to run, space-separated (see workers/run-job.ts CRON_FUNCTION_IDS)"
        required: true
        type: string
      dry_run:
        description: "Only list what would run (no API calls, no writes)"
        required: false
        default: false
        type: boolean

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
  TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
  KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
  KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
  STREAMHATCHET_API_KEY: ${{ secrets.STREAMHATCHET_API_KEY }}
  # Helix pacing (adapters/twitch-rate.ts): the default background scope,
  # as on Inngest. game-snapshot enters its own "game" scope per step.
  TWITCH_RATE_PRIORITY: job
  JOBS: ${{ inputs.jobs }}
  # Not `&& ''`: an empty string is falsy here and would always pick --write.
  WRITE_FLAG: ${{ inputs.dry_run && '--dry-run' || '--write' }}

jobs:
  run:
    runs-on: ubuntu-latest
    # The daily slot is the longest (discovery + enrichment); the others
    # finish in minutes.
    timeout-minutes: 120
    # One group per set of jobs: a run waits for the previous run of the
    # same slot instead of overlapping it; different slots run side by side.
    concurrency:
      group: scheduled-jobs-${{ inputs.jobs }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @twitchmetrics/database db:generate
      - name: Run ${{ inputs.jobs }}
        # $JOBS unquoted on purpose: one argument per job id.
        run: |
          npx tsx --tsconfig apps/web/tsconfig.json workers/run-job.ts fn $JOBS $WRITE_FLAG
