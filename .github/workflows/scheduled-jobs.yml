# Every recurring data job that used to be an Inngest cron (2026-11-19).
#
# WHY THIS EXISTS. Inngest's Hobby plan allows 50K executions a month and
# counts every step; we ran ~85K, so the crons stopped mid-month (2026-10 and
# again 2026-11-17: game pages lost live Twitch/Kick stats). Here each job is
# one process that runs the same handler as the Inngest function
# (workers/run-job.ts fn <id>), writing the same IngestionRun rows.
#
# Schedule -> jobs (same slots as the old Inngest crons, jobs of one slot run
# one after the other; a failed job doesn't stop the next ones):
#   */30          game-snapshot                       (Twitch live game stats)
#   20 * * * *    kick-category-snapshot
#   15 */3 * * *  kick-channel-snapshot
#   35 */6 * * *  kick-category-discovery
#   0 4 * * *     enrich-creators, demote-inactive-creators, discover-games,
#                 enrich-games, discover-creators, enrich-claimed-profiles,
#                 finalize-stale-ingestion-runs
#
# GitHub starts scheduled runs late (minutes, sometimes more) and can skip one
# under load. A late game-snapshot is stamped with the 30-min slot it started
# in, so a skipped run is a missing point on the game charts, never a
# duplicate. If the gaps matter, have an external scheduler call
# workflow_dispatch (starts within about a minute) and drop `schedule` here.
#
# Still on Inngest: refresh-tokens (needs every OAuth client secret), the
# github-jobs-watchdog (must not depend on GitHub), the app's events (claims,
# connect), and the three streamhatchet-* snapshots (live games, live
# channels, game discovery): the STREAMHATCHET_API_KEY secret here is
# rejected by their API (401, 2026-11-20); only Vercel has a valid token.
# Once the secret is right, test it with a manual run of
# streamhatchet-live-games-snapshot, then add the three back to the 20 and 35
# slots and drop their crons on Inngest. About 20K executions a month until
# then, under the 50K cap.
#
# No Upstash secrets on purpose: cache calls are skipped
# (services/cache.ts isCacheConfigured) and cached responses expire on their
# TTL. The per-game SCAN invalidation is what exhausted the Upstash request
# cap in 2026-10.
#
# Manual runs: Actions tab -> this workflow -> Run workflow, with the job ids.
#
# Required repository secrets: DATABASE_URL, DIRECT_URL, TWITCH_CLIENT_ID,
# TWITCH_CLIENT_SECRET, KICK_CLIENT_ID, KICK_CLIENT_SECRET, YOUTUBE_API_KEY,
# TWITTER_BEARER_TOKEN, ENCRYPTION_KEY; STREAMHATCHET_API_KEY (manual
# streamhatchet-* runs only, see above).

name: Scheduled jobs

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "20 * * * *"
    - cron: "15 */3 * * *"
    - cron: "35 */6 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Job ids to run, space-separated (see workers/run-job.ts CRON_FUNCTION_IDS)"
        required: true
        type: string
      dry_run:
        description: "Only list what would run (no API calls, no writes)"
        required: false
        default: false
        type: boolean

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}
  TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
  TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
  KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
  KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
  STREAMHATCHET_API_KEY: ${{ secrets.STREAMHATCHET_API_KEY }}
  # Helix pacing (adapters/twitch-rate.ts): the default background scope,
  # as on Inngest. game-snapshot enters its own "game" scope per step.
  TWITCH_RATE_PRIORITY: job
  SCHEDULE: ${{ github.event.schedule }}
  INPUT_JOBS: ${{ inputs.jobs }}
  # Not `&& ''`: an empty string is falsy here and would always pick --write.
  WRITE_FLAG: ${{ inputs.dry_run && '--dry-run' || '--write' }}

jobs:
  run:
    runs-on: ubuntu-latest
    # The daily slot is the longest (discovery + enrichment); the others
    # finish in minutes.
    timeout-minutes: 120
    # One group per slot: a late run waits for the previous run of the same
    # slot instead of overlapping it; different slots run side by side.
    concurrency:
      group: scheduled-jobs-${{ github.event.schedule || inputs.jobs }}
      cancel-in-progress: false
    steps:
      - name: Pick the jobs of this slot
        id: pick
        run: |
          case "$SCHEDULE" in
            "*/30 * * * *") jobs="game-snapshot" ;;
            "20 * * * *") jobs="kick-category-snapshot" ;;
            "15 */3 * * *") jobs="kick-channel-snapshot" ;;
            "35 */6 * * *") jobs="kick-category-discovery" ;;
            "0 4 * * *") jobs="enrich-creators demote-inactive-creators discover-games enrich-games discover-creators enrich-claimed-profiles finalize-stale-ingestion-runs" ;;
            "") jobs="$INPUT_JOBS" ;;
            *) echo "::error::no jobs mapped to schedule '$SCHEDULE'"; exit 1 ;;
          esac
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @twitchmetrics/database db:generate
      - name: Run ${{ steps.pick.outputs.jobs }}
        env:
          JOBS: ${{ steps.pick.outputs.jobs }}
        # $JOBS unquoted on purpose: one argument per job id.
        run: |
          npx tsx --tsconfig apps/web/tsconfig.json workers/run-job.ts fn $JOBS $WRITE_FLAG
